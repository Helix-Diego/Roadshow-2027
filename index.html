/* Panels may grow or scroll; no content is trapped above a centered container. */
body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr)}
body>header{min-width:0}
body:not(.presenting) main,.presenting main{height:auto;min-height:0}
body:not(.presenting) .stage{min-height:0}
.presenting .stage{min-height:0;min-width:0}
#cue:not([hidden]){min-height:0;align-items:safe center;overscroll-behavior:contain}
#cue-card{flex-shrink:0}
#sketch-slot:not([hidden]),.product-slide #sketch-slot:not([hidden]){align-self:stretch;min-height:0;max-height:100%;margin:0;overflow:auto;pointer-events:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:#749580 transparent;scroll-padding:16px}
#sketch-slot :where(div,section){min-width:0}
#sketch-slot{overflow-wrap:anywhere}
.mock-window header{gap:8px;flex-wrap:wrap}
.change-context .flow{grid-template-columns:minmax(0,1fr) auto minmax(0,1fr)}
.dashboard-annotated,.change-product,.teams-product{display:grid;gap:12px;padding-top:0}
.dashboard-benefit,.change-benefit,.teams-benefit{position:relative;inset:auto;justify-self:start;margin:4px 4% 0;max-width:90%}
.dashboard-benefit-link,.change-benefit-line,.teams-benefit-line{position:relative;inset:auto;height:20px;margin:-12px 0 -12px 20%}
/* Reserve natural rows for callouts, even when a translated line wraps. */
.annotated-monitor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px 16px;padding:4px 12px}
.annotated-monitor .monitor{grid-area:2/1/3/-1}
.value-callout{position:relative;inset:auto;width:auto;max-width:none;margin:0;align-self:start}
.callout-discovery{grid-area:1/1;justify-self:start;width:85%}
.callout-situations{grid-area:3/1}.callout-automation{grid-area:3/2}
@media(min-width:1025px){
  #sketch-slot:not([hidden]){padding:12px 10px 20px}
  #cue:not([hidden]){padding:16px}
  #cue-card{padding:clamp(18px,2vw,30px)}
}
@media(max-width:1024px){
  body{height:auto;min-height:100dvh;display:block}
  body:not(.presenting) main{height:calc(100dvh - 162px);min-height:280px}
  .presenting main{height:auto;overflow:visible}
  #cue:not([hidden]){overflow:visible;max-height:none;align-items:start;overscroll-behavior:auto}
  #sketch-slot:not([hidden]),.product-slide #sketch-slot:not([hidden]){max-height:none;overflow:visible;overscroll-behavior:auto;padding:12px 12px 24px}
  .dashboard-benefit,.change-benefit,.teams-benefit{justify-self:stretch;margin:0;max-width:none}
  .annotated-monitor{grid-template-columns:minmax(0,1fr);padding:0 0 0 18px;gap:16px}
  .annotated-monitor .monitor{grid-area:2/1}
  .callout-discovery{grid-area:1/1;justify-self:stretch;width:auto}
  .callout-situations{grid-area:3/1}.callout-automation{grid-area:4/1}
  .product-slide .stage #tour-label{display:none}
  .presenting .stage{padding-bottom:calc(100px + env(safe-area-inset-bottom))}
  #stage-controls:not([hidden]){gap:8px}
}
@media(max-width:420px){
  .dashboard-stats,.technical-charts,.business-charts,.optimizer-metrics,.outcomes-metrics{grid-template-columns:minmax(0,1fr)}
  .dashboard-stats strong{font-size:26px}
  .teams-message{grid-template-columns:26px minmax(0,1fr);gap:8px}
  .teams-avatar{width:26px;height:26px}
  .teams-response{padding:10px}
  .outcomes-metrics strong{white-space:normal}
}
